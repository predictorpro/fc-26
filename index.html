<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1a11">
<meta name="color-scheme" content="dark">
<title>Приглашение на турнир TR League 1X</title>
<meta property="og:title" content="Приглашение на турнир TR League 1X">
<meta property="og:description" content="Открой приглашение, ответь и выбери клуб.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Russo+One&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b1a11;
    --bg2: #12301f;
    --pitch-a: #1f5b3a;
    --pitch-b: #266b44;
    --chalk: #f5f3ea;
    --gold: #f0c04a;
    --red: #d8342c;
    --green: #2e9b5f;
    --ink: #0f2418;
    --line: rgba(245,243,234,.16);
    --card: rgba(245,243,234,.07);
    --display: "Russo One", Impact, "Arial Black", sans-serif;
    box-sizing: border-box;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { color-scheme: dark; height: 100%; }
  body {
    margin: 0; height: 100%; background: #060f0a; color: var(--chalk);
    font-family: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    line-height: 1.4; -webkit-text-size-adjust: 100%;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* ---------- сцена и переходы ---------- */
  .stage { position: relative; width: min(100%, 460px); height: 100vh; height: 100dvh; margin: 0 auto;
    overflow: hidden; background: var(--bg); }
  .screen { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; background: var(--bg);
    transition: transform .4s cubic-bezier(.3,.75,.2,1), opacity .4s ease; -webkit-overflow-scrolling: touch; }
  .screen.enter-right { transform: translateX(100%); }
  .screen.enter-left { transform: translateX(-28%); opacity: 0; }
  .screen.leave-left { transform: translateX(-28%); opacity: 0; pointer-events: none; }
  .screen.leave-right { transform: translateX(100%); pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { .screen { transition: none; } }

  /* ---------- общее: шапка, кнопки, сообщения ---------- */
  .col { display: flex; flex-direction: column; overflow: hidden; }
  .bar { display: flex; align-items: center; gap: 12px; flex: none;
    padding: calc(14px + env(safe-area-inset-top, 0px)) 14px 12px; border-bottom: 1px solid var(--line); background: var(--bg); }
  .back { width: 42px; height: 42px; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--card); }
  .back svg { width: 22px; height: 22px; }
  .bar h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 22px; line-height: 1.15; }
  .bar-sub { margin: 2px 0 0; font-size: 13px; opacity: .75; }
  .bar .flag { width: 42px; height: 28px; }
  .flag { display: block; border-radius: 4px; overflow: hidden; outline: 1px solid rgba(255,255,255,.28); outline-offset: -1px; background: #333; flex: none; }
  .flag svg { display: block; width: 100%; height: 100%; }
  .badge { display: block; width: 40px; height: 46px; flex: none; }
  .badge svg, .badge img { display: block; width: 100%; height: 100%; object-fit: contain; }
  .msg { margin: 0 0 10px; padding: 9px 12px; border-radius: 10px; font-size: 14px;
    background: rgba(216,52,44,.2); border: 1px solid rgba(216,52,44,.6); }
  .btn { min-height: 52px; padding: 12px 16px; border-radius: 14px; font-weight: 600; font-size: 17px;
    background: rgba(245,243,234,.12); transition: transform .12s ease, opacity .2s; }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn.green { background: var(--green); }
  .btn.red { background: var(--red); color: #fff; }
  .link { text-decoration: underline; text-underline-offset: 3px; padding: 10px 6px; font-size: 15px; opacity: .9; }
  .center { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; }
  .center h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 26px; }
  .center p { margin: 0; opacity: .8; }

  /* ---------- экран приглашения ---------- */
  .invite { display: flex; flex-direction: column; }
  .hero { position: relative; flex: 1 0 auto; min-height: 620px; display: flex; flex-direction: column; overflow: hidden; isolation: isolate;
    background: repeating-linear-gradient(180deg, var(--pitch-a) 0 64px, var(--pitch-b) 64px 128px); }
  .lines { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
  .lines * { fill: none; stroke: var(--chalk); stroke-opacity: .5; stroke-width: 2.5; }
  .lines .dot { fill: var(--chalk); fill-opacity: .5; stroke: none; }
  .goal { position: absolute; z-index: 1; top: calc(3% + env(safe-area-inset-top, 0px)); left: 50%; width: 58%; height: 11%;
    transform: translateX(-50%); transform-origin: 50% 0; border: 3px solid var(--chalk); border-bottom: none; border-radius: 4px 4px 0 0;
    background: repeating-linear-gradient(45deg, rgba(245,243,234,.28) 0 1.5px, transparent 1.5px 12px),
      repeating-linear-gradient(-45deg, rgba(245,243,234,.28) 0 1.5px, transparent 1.5px 12px), var(--ink); }
  .ball { position: absolute; z-index: 3; left: 28%; bottom: 5%; width: 58px; height: 58px; transform: translateX(-50%) scale(1.3); }
  .ball svg { width: 100%; height: 100%; display: block; }
  .ball .spin { transform-origin: 50% 50%; }
  .ball-shadow { position: absolute; z-index: 2; left: 28%; bottom: 3.4%; width: 62px; height: 12px; border-radius: 50%;
    background: rgba(0,0,0,.35); transform: translateX(-50%); }
  .flash { position: absolute; inset: 0; z-index: 4; pointer-events: none; opacity: 0;
    background: radial-gradient(circle at 50% 14%, rgba(255,255,255,.95), rgba(255,255,255,0) 55%); }
  .hero-content { position: relative; z-index: 5; flex: 1 0 auto; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; padding: calc(104px + env(safe-area-inset-top, 0px)) 7% 22px; }
  .kicker { margin: 0 0 8px; font-size: 15px; font-weight: 500; background: rgba(15,36,24,.78); padding: 6px 14px; border-radius: 999px; }
  .name { position: relative; margin: 0; padding-bottom: 12px; white-space: nowrap; font-family: var(--display); font-weight: 400;
    line-height: 1; font-size: clamp(50px, 16vw, 78px); text-shadow: 0 3px 0 rgba(15,36,24,.85), 0 8px 24px rgba(0,0,0,.35); }
  .name.mid { font-size: clamp(42px, 13.5vw, 64px); }
  .name.long { font-size: clamp(34px, 11.5vw, 54px); }
  .name::after { content: ""; position: absolute; left: 4%; right: 4%; bottom: 0; height: 5px; background: var(--gold);
    border-radius: 3px; transform-origin: left center; }
  .lead { margin: 12px 0 0; font-size: clamp(17px, 4.6vw, 20px); font-weight: 500; max-width: 18em; text-shadow: 0 2px 10px rgba(0,0,0,.5); }
  .event { margin: 14px 0 0; display: inline-flex; flex-direction: column; align-items: center; background: var(--chalk);
    color: var(--ink); padding: 9px 22px 11px; border-radius: 14px; transform: rotate(-2deg); box-shadow: 0 10px 28px rgba(0,0,0,.35); }
  .event b { font-family: var(--display); font-weight: 400; font-size: clamp(26px, 8vw, 34px); line-height: 1; color: var(--red); white-space: nowrap; }
  .event span { font-size: 14px; font-weight: 600; margin-top: 4px; }
  .event span.dur { font-weight: 500; font-size: 13px; margin-top: 2px; opacity: .8; }
  .lockline { margin: 12px 0 0; font-size: 14px; font-weight: 600; color: var(--gold); background: rgba(15,36,24,.78); padding: 5px 14px; border-radius: 999px; }
  .startbox { margin: 16px 0 4px; text-align: center; }
  .timer-label { margin: 0; font-size: 13px; opacity: .8; }
  .startbox .timer { margin-top: 8px; }
  .startbox .started { display: inline-block; margin: 8px 0 0; }
  .lockbar { margin: 10px 0 0; font-size: 13px; font-weight: 600; color: var(--gold); text-align: center; font-variant-numeric: tabular-nums; }
  .lockbar.locked { color: var(--chalk); opacity: .75; }
  .dock .lockbar { margin: 0 0 8px; }
  .panel .lockbar { text-align: left; }
  .when { margin: 16px 0 0; font-size: 17px; font-weight: 600; background: rgba(15,36,24,.78); padding: 6px 16px; border-radius: 10px; }
  .where { display: block; font-size: 15px; font-weight: 500; margin-top: 2px; }
  .timer { margin-top: 10px; display: flex; gap: 8px; justify-content: center; }
  .unit { min-width: 60px; padding: 7px 6px 6px; background: var(--ink); border: 2px solid var(--gold); border-radius: 10px;
    display: flex; flex-direction: column; align-items: center; }
  .unit b { font-family: var(--display); font-weight: 400; font-size: 26px; line-height: 1; color: var(--gold); font-variant-numeric: tabular-nums; }
  .unit span { font-size: 12px; margin-top: 3px; }
  .started { margin: 10px 0 0; font-family: var(--display); font-size: 22px; color: var(--gold); background: rgba(15,36,24,.85); padding: 8px 18px; border-radius: 10px; }
  .rule { margin: 14px 0 0; font-size: 14px; font-weight: 500; max-width: 21em; text-align: left; background: rgba(15,36,24,.75);
    border-left: 4px solid var(--red); padding: 5px 12px 5px 10px; border-radius: 0 8px 8px 0; }
  .cta { position: sticky; bottom: 0; z-index: 8; flex: none; padding: 26px 14px calc(14px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(to top, rgba(11,26,17,.98) 62%, rgba(11,26,17,0)); }
  .cta .row { display: grid; grid-template-columns: 1.35fr 1fr; gap: 10px; }
  .cta .msg { margin-bottom: 10px; }
  .cta-hint { margin: 10px 0 0; font-size: 12px; text-align: center; color: var(--gold); opacity: .9; }
  .demo-note { margin: 0 0 14px; padding: 9px 12px; border-radius: 10px; font-size: 13px; background: rgba(240,192,74,.14); border: 1px solid rgba(240,192,74,.5); }

  .reveal { opacity: 0; }
  .still .reveal, .still .cta { opacity: 1; }
  .still .ball { bottom: 85.5%; left: 50%; transform: translateX(-50%) scale(.5); }
  .still .ball-shadow { opacity: 0; }
  .still .name::after { transform: scaleX(1); }
  .go .ball { animation: fly 1.25s cubic-bezier(.25,.6,.3,1) .45s both, curve 1.25s ease-in-out .45s both; }
  .go .ball .spin { animation: spin 1.25s linear .45s both; }
  .go .ball-shadow { animation: fade-out .5s ease .5s both; }
  .go .goal { animation: net .7s ease-out 1.65s both; }
  .go .flash { animation: flash .6s ease-out 1.65s both; }
  .go .kicker { animation: rise .5s ease-out 2.0s both; }
  .go .name { animation: pop .5s cubic-bezier(.2,.9,.3,1.2) 2.2s both; }
  .go .name::after { animation: draw .5s ease-out 2.7s both; transform: scaleX(0); }
  .go .lead { animation: rise .5s ease-out 2.9s both; }
  .go .event { animation: slap .45s cubic-bezier(.2,.9,.3,1.2) 3.3s both; }
  .go .when { animation: rise .5s ease-out 3.6s both; }
  .go .timer, .go .started { animation: rise .5s ease-out 3.85s both; }
  .go .lockline { animation: rise .5s ease-out 4.0s both; }
  .go .rule { animation: rise .5s ease-out 4.15s both; }
  .go .cta { opacity: 0; animation: rise .5s ease-out 3.6s both; }
  @keyframes fly { from { bottom: 5%; transform: translateX(-50%) scale(1.3); } to { bottom: 85.5%; transform: translateX(-50%) scale(.5); } }
  @keyframes curve { from { left: 28%; } to { left: 50%; } }
  @keyframes spin { to { transform: rotate(900deg); } }
  @keyframes fade-out { to { opacity: 0; } }
  @keyframes net { 0% { transform: translateX(-50%) scaleY(1); } 25% { transform: translateX(-50%) scaleY(1.28) scaleX(1.04); }
    55% { transform: translateX(-50%) scaleY(.94); } 100% { transform: translateX(-50%) scaleY(1); } }
  @keyframes flash { 0% { opacity: .9; } 100% { opacity: 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: none; } }
  @keyframes draw { to { transform: scaleX(1); } }
  @keyframes slap { from { opacity: 0; transform: rotate(-2deg) scale(1.6); } to { opacity: 1; transform: rotate(-2deg) scale(1); } }
  @media (prefers-reduced-motion: reduce) {
    .go *, .go *::before, .go *::after { animation-duration: .01ms !important; animation-delay: 0s !important; }
  }

  /* ---------- выбор страны ---------- */
  .search { flex: none; padding: 12px 14px 4px; }
  .search input { width: 100%; min-height: 46px; padding: 10px 14px; border-radius: 12px; border: 2px solid var(--line);
    background: rgba(0,0,0,.25); color: var(--chalk); font: inherit; font-size: 16px; }
  .search input::placeholder { color: rgba(245,243,234,.55); }
  .scroll { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px 14px calc(18px + env(safe-area-inset-bottom, 0px)); }
  .countries { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .country { display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 12px 3px 10px; border-radius: 14px;
    background: var(--card); border: 2px solid transparent; text-align: center; transition: transform .12s ease, border-color .2s; }
  .country:active { transform: scale(.96); }
  .country:hover { border-color: var(--line); }
  .country .flag { width: 54px; height: 36px; }
  .cname { font-size: 12.5px; font-weight: 600; line-height: 1.15; overflow-wrap: break-word; max-width: 100%; }
  .ccount { font-size: 12px; opacity: .65; }
  .empty { grid-column: 1 / -1; text-align: center; opacity: .7; padding: 24px 0; }

  /* ---------- выбор клуба ---------- */
  .clubs { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 14px; display: grid;
    grid-template-columns: repeat(2, 1fr); gap: 10px; align-content: start; }
  .club { display: flex; align-items: center; gap: 10px; min-height: 66px; padding: 8px 10px; border-radius: 14px; text-align: left;
    background: var(--card); border: 2px solid transparent; transition: transform .12s ease; }
  .club:active:not(:disabled) { transform: scale(.97); }
  .club .badge { width: 34px; height: 39px; }
  .cn { display: flex; flex-direction: column; min-width: 0; }
  .cn b { font-size: 14px; font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
  .cn small { font-size: 12px; opacity: .7; }
  .club[aria-pressed="true"] { background: var(--gold); color: var(--ink); border-color: #fff3c4; }
  .club[aria-pressed="true"] small { opacity: .85; }
  .club:disabled { opacity: .42; cursor: not-allowed; }
  .club:disabled b { text-decoration: line-through; text-decoration-thickness: 1px; }
  .dock { flex: none; padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px)); background: rgba(11,26,17,.97);
    border-top: 1px solid var(--line); }
  .confirm { width: 100%; min-height: 54px; padding: 0 16px; border-radius: 999px; font-weight: 600; font-size: 17px; background: var(--red);
    color: #fff; box-shadow: 0 8px 20px rgba(0,0,0,.35); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .confirm:disabled { background: rgba(245,243,234,.14); color: rgba(245,243,234,.55); box-shadow: none; cursor: not-allowed; }
  .tabs { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; padding: 9px 14px; border-radius: 999px; font-size: 14px; font-weight: 500; background: rgba(245,243,234,.1);
    border: 2px solid transparent; white-space: nowrap; }
  .tab[aria-selected="true"] { background: var(--chalk); color: var(--ink); font-weight: 600; }

  /* ---------- итог ---------- */
  .done-wrap { padding: calc(22px + env(safe-area-inset-top, 0px)) 14px calc(26px + env(safe-area-inset-bottom, 0px)); }
  .panel { padding: 18px 16px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; margin-bottom: 14px; }
  .panel h2 { margin: 0 0 4px; font-family: var(--display); font-weight: 400; font-size: 26px; }
  .sub { margin: 0 0 4px; font-size: 14px; opacity: .78; }
  .mine { display: flex; align-items: center; gap: 14px; margin-top: 14px; }
  .mine .badge { width: 56px; height: 64px; }
  .mine b { font-size: 20px; display: block; }
  .mine small { font-size: 13px; opacity: .75; }
  .acts { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 10px; }
  .people { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .person { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 12px; background: rgba(245,243,234,.07); }
  .person.me { border: 1px solid var(--gold); }
  .who { font-weight: 600; }
  .who i { font-style: normal; font-weight: 400; font-size: 12px; opacity: .7; margin-left: 6px; }
  .pteam { display: flex; align-items: center; gap: 8px; min-width: 0; justify-content: flex-end; text-align: right; }
  .pteam .badge { width: 24px; height: 28px; }
  .pteam span { font-size: 14px; overflow-wrap: anywhere; }
  .tag { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  .tag.no { background: var(--red); }
  .tag.wait { background: rgba(245,243,234,.14); font-weight: 500; }
  .pickers { display: grid; gap: 10px; width: 100%; max-width: 340px; }
  .pickers.two { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 380px; }
  .pickers .btn { min-height: 48px; font-size: 16px; padding: 10px 8px; overflow-wrap: anywhere; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<noscript><p style="padding:24px;text-align:center">Для работы приглашения нужен включённый JavaScript.</p></noscript>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
